name: deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest && pytest -q

  build:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04-arm # AgentCore needs linux/arm64 images
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - run: |
          IMG=${{ steps.ecr.outputs.registry }}/calc-agent:${{ github.sha }}
          docker build --platform linux/arm64 -t "$IMG" .
          docker push "$IMG"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: prod # add required reviewers in repo settings
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
        working-directory: infra
      - run: terraform apply -auto-approve -var image_tag=${{ github.sha }}
        working-directory: infra
